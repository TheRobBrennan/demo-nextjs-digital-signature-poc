# Infrastructure for the demo. Postgres for signature records and the audit
# chain, MinIO for document bytes.
#
# Everything is bound to localhost with demo credentials from .env. Nothing
# here is intended to be reachable from anywhere else.

name: ${COMPOSE_PROJECT_NAME:-sigdemo}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigdemo}
      POSTGRES_DB: ${POSTGRES_DB:-sigdemo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigdemo} -d ${POSTGRES_DB:-sigdemo}"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sigdemo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sigdemo123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Behind a profile: `make up` stays infrastructure-only (fast, and what the
  # guided demo drives with a native dev server), while `make up-full` runs the
  # app as a container the way it would actually deploy.
  web:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    environment:
      # Service names, not localhost - this resolves inside the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-sigdemo}:${POSTGRES_PASSWORD:-sigdemo}@postgres:5432/${POSTGRES_DB:-sigdemo}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-west-2}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-sigdemo}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-sigdemo123}
      S3_FORCE_PATH_STYLE: "true"
      SIGNING_KEY_PATH: /app/keys/signing-key.pem
    volumes:
      # Shared with the host so a document signed by `make sign` verifies in
      # the container and vice versa. Two key files was a real bug once.
      - ../keys:/app/keys
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
